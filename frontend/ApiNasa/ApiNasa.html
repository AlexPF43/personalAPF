<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/Estilos/styiles.css">
    <title>ApiNasa</title>
</head>
<body>
    <h1 class="headerApiNasa">IMAGEN DEL DIA</h1>
    <h2 id="titulo-nasa">Cargando título...</h2>
    <img id="imagen-nasa" alt="Image">
    <p id="explicacion-nasa">Cargando explicación...</p>
    <p id="copyright-nasa">copyright</p>
    <p id="fecha-nasa">YYYY-MM-DD</p>


    <script>
        function cargarDatos() {
            const titulo = document.getElementById("titulo-nasa");
            const imagen = document.getElementById("imagen-nasa");
            const explicacion = document.getElementById("explicacion-nasa");
            const copyright = document.getElementById("copyright-nasa");
            const fecha = document.getElementById("fecha-nasa");

            fetch("https://api.nasa.gov/planetary/apod?api_key=IQA0Qmbm4bRKlMvpGBCymq2F5MsnHaCrRhZTxAJf&date=2020-02-6")
                .then((response) => {
                    if (!response.ok) {
                        throw new Error("No se pudieron obtener los datos.");
                    }

                    return response.json();
                })
                .then((data) => {
                    titulo.textContent = data.title;
                    imagen.alt=data.url;
                    imagen.src = data.hdurl || data.url;
                    explicacion.textContent = data.explanation;
                    copyright.textContent = `Copyright: ${data.copyright || "No disponible"}`;
                    fecha.textContent = `Fecha: ${data.date}`;
                })
                .catch(() => {
                    titulo.textContent = "-";
                    imagen.removeAttribute("src");
                    explicacion.textContent = "-";
                    copyright.textContent = "-";
                    fecha.textContent = "";
                    const mensajeError = document.createElement("p");
                    mensajeError.style.color="#c43030"
                    mensajeError.style.fontSize="32px"
                    mensajeError.textContent="No se han podido obtener los datos de la api"
                    document.body.appendChild(mensajeError);
                });
        }

        cargarDatos();
    </script>
</body>
</html>
